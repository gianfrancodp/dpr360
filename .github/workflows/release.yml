name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Unit tests
        run: python -m pytest
      - name: Build DPR360
        run: python -m PyInstaller --noconfirm --clean dpr360.spec
      - name: Add top-level runtime documentation
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, COPYRIGHT, THIRD_PARTY_NOTICES.md, config.yaml -Destination .\dist\dpr360\ -Force
          New-Item -ItemType Directory -Force .\dist\dpr360\.streamlit | Out-Null
          Copy-Item .\.streamlit\config.toml .\dist\dpr360\.streamlit\config.toml -Force
      - name: Frozen launcher smoke check
        shell: pwsh
        run: .\dist\dpr360\dpr360.exe --version
      - name: Package release
        shell: pwsh
        run: |
          $name = "dpr360-windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path .\dist\dpr360\* -DestinationPath $name -Force
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  " + $name | Set-Content ($name + ".sha256")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dpr360-windows-x64-${{ github.ref_name }}.zip
            dpr360-windows-x64-${{ github.ref_name }}.zip.sha256
